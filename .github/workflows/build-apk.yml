# .github/workflows/build-apk.yml
# Ushbu fayl GitHub Actions orqali yaxlit o'rnatiladigan Android APK dasturini avtomatik yig'ib beradi.

name: Build NTFS OTG Driver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repozitoriyani yuklab olish
        uses: actions/checkout@v4

      - name: JDK 17 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK va NDK muhitini sozlash
        uses: android-actions/setup-android@v3

      - name: NDK va CMake paketlarini o'rnatish
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Loyiha tuzilmasini va konfiguratsiya fayllarini avtomatik yaratish
        run: |
          mkdir -p app/src/main/java/uz/android/ntfsdriver
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          if [ -f "NtfsOtgDriverApp.kt" ]; then
            cp NtfsOtgDriverApp.kt app/src/main/java/uz/android/ntfsdriver/NtfsOtgDriverApp.kt
          fi
          if [ -f "ntfs_jni_driver.cpp" ]; then
            cp ntfs_jni_driver.cpp app/src/main/cpp/ntfs_jni_driver.cpp
          fi

          # 1. settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NtfsOtgDriver"
          include(":app")
          EOF

          # 2. Root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # 4. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "uz.android.ntfsdriver"
              compileSdk = 34
              ndkVersion = "26.1.10909125"

              defaultConfig {
                  applicationId = "uz.android.ntfsdriver"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a", "x86_64")
                  }
                  externalNativeBuild {
                      cmake {
                          cppFlags += "-std=c++20 -O3 -Wall"
                      }
                  }
              }

              externalNativeBuild {
                  cmake {
                      path = file("src/main/cpp/CMakeLists.txt")
                      version = "3.22.1"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF

          # 5. app/src/main/cpp/CMakeLists.txt
          cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
          cmake_minimum_required(VERSION 3.22.1)
          project("ntfs_jni_driver")

          add_library(ntfs_jni_driver SHARED ntfs_jni_driver.cpp)

          find_library(log-lib log)
          find_library(android-lib android)

          target_link_libraries(
              ntfs_jni_driver
              ${log-lib}
              ${android-lib}
          )
          EOF

          # 6. app/src/main/res/xml/device_filter.xml (USB Mass Storage BOT/UAS)
          cat << 'EOF' > app/src/main/res/xml/device_filter.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <usb-device class="8" subclass="6" protocol="80" />
              <usb-device class="8" subclass="6" protocol="98" />
          </resources>
          EOF

          # 7. app/src/main/res/values/strings.xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">NTFS USB-OTG Drayver</string>
          </resources>
          EOF

          # 8. app/src/main/AndroidManifest.xml (MainActivity + USB Auto-Launch + SAF Provider)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-feature
                  android:name="android.hardware.usb.host"
                  android:required="true" />

              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CONNECTED_DEVICE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/stat_sys_data_usb"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </activity>

                  <receiver
                      android:name=".NtfsUsbReceiver"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED" />
                          <action android:name="android.hardware.usb.action.USB_DEVICE_DETACHED" />
                          <action android:name="uz.android.ntfsdriver.USB_PERMISSION" />
                      </intent-filter>
                      <meta-data
                          android:name="android.hardware.usb.action.USB_DEVICE_ATTACHED"
                          android:resource="@xml/device_filter" />
                  </receiver>

                  <service
                      android:name=".NtfsDriverService"
                      android:exported="false"
                      android:foregroundServiceType="connectedDevice" />

                  <provider
                      android:name=".NtfsDocumentsProvider"
                      android:authorities="uz.android.ntfsdriver.documents"
                      android:exported="true"
                      android:grantUriPermissions="true"
                      android:permission="android.permission.MANAGE_DOCUMENTS">
                      <intent-filter>
                          <action android:name="android.content.action.DOCUMENTS_PROVIDER" />
                      </intent-filter>
                  </provider>

              </application>
          </manifest>
          EOF

      - name: Gradle o'rnatish va APK yig'ish
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: APK faylini kompilatsiya qilish (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: Tayyor APK faylini yuklab olish uchun saqlash
        uses: actions/upload-artifact@v4
        with:
          name: NtfsOtgDriver-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
